<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Caso del Cristal Robado · Un misterio en Nexópolis</title>
  <meta name="description" content="Juego de misterio por equipos, en red, sobre las Normas Comunitarias de Meta.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">

<body>

  <div class="vignette"></div>

    <div id="room-badge" class="room-badge"></div>

    <div class="facets" id="facets"></div>

    <button class="icon-btn" id="btn-codex"></button>
    <button class="icon-btn" id="btn-board">🔎 Tablero</button>
    <button class="icon-btn" id="snd" title="Sonido">🔊</button>
    <button class="icon-btn" id="btn-fs" title="Pantalla completa">⛶</button>
    <button class="icon-btn" id="btn-menu" title="Menú del moderador">☰</button>
  </header>

  <main id="stage"></main>
  <footer id="dock" class="hidden"></footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <canvas id="confetti"></canvas>

  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-database-compat.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/games.js"></script>
