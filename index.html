<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Caso del Cristal Robado · Un misterio en Nexópolis</title>
  <meta name="description" content="Juego grupal e interactivo de misterio sobre las políticas de Meta: 5 misiones, pistas secretas y un culpable por descubrir.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div>
  <canvas id="sky"></canvas>

  <header id="topbar">
    <div class="brand" id="brand" title="Ir al mapa">
      <svg class="crystal" viewBox="0 0 200 210"><path d="M100 10 L180 90 L110 200 L20 90Z" fill="url(#bgrad)"/><defs><linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs></svg>
      <span>El Caso del Cristal Robado</span>
    </div>
    <div class="facets" id="facets" title="Fragmentos del cristal recuperados"></div>
    <div class="top-spacer"></div>
    <div class="clock" id="clock">⏱ 0:00</div>
    <button class="icon-btn" id="btn-codex">📚 Políticas</button>
    <button class="icon-btn" id="btn-sus">🕵️ Sospechosos</button>
    <button class="icon-btn" id="snd" title="Sonido">🔊</button>
    <button class="icon-btn" id="btn-fs" title="Pantalla completa">⛶</button>
    <button class="icon-btn" id="btn-menu" title="Menú del moderador">☰</button>
  </header>

  <main id="stage"></main>
  <footer id="scorebar"></footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <canvas id="confetti"></canvas>
  <div id="print-sheet"></div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
